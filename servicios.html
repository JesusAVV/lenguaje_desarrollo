<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Fast Shopping - Bicicletas</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --navbar-bg: #ec0e0e;
      --navbar-text: #f2f2f2;
      --navbar-hover: #575757;
      --header-bg: #6b8e23;
      --btn-bg: #6b8e23;
    }
  </style>
</head>
<body>

  <!-- Barra de menú -->
  <div id="navbar-container"></div>

  <!-- Banner -->
  <header>
    <h1>bicicleta de montaña</h1>
    <p>aventura sin limites</p>
  </header>

  <!-- Productos -->
  <main class="productos" id="productos-container"></main>

  <script src="components.js"></script>
  <script>
    renderNavbar("navbar-container");

    renderProductCards("productos-container", [
      {
        image: "imagenes/cascosfox.jpg",
        alt: "cascos fox red",
        name: "cascos fox red",
        price: "S/499 soles",
        description: "Cálido y suave para el uso de montaña."
      },
      {
        image: "imagenes/frenos deore.jpg",
        alt: "frenos shimano deore",
        name: "frenos shimano deore 2 pistones",
        price: "S/600 soles",
        description: "frenos purgados para el uso de montaña."
      },
      {
        image: "imagenes/llantasmaxis.jpg",
        alt: "llantas maxxis dh",
        name: "llantas maxxis dh",
        price: "S/299 soles",
        description: "Perfecta para la montaña y cerros con mucha aventura."
      },
      {
        image: "imagenes/rodileras fox.jpg",
        alt: "rodileras fox",
        name: "rodileras fox",
        price: "S/299",
        description: "Prenda comoda para usar al levantarte."
      },
      {
        image: "Imagenes/Pantalon_ligero_mujer.jpg",
        alt: "Pantalon Ligero",
        name: "Pantalon Ligero - Mujer",
        price: "15.90/s",
        description: "Perfecto para el uso cotidiano."
      },
      {
        image: "Imagenes/Sueter_Lana_mujer.jpg",
        alt: "Polera ligera",
        name: "Polera ligera - Mujer",
        price: "25.90/s",
        description: "Usual para los climas frios."
      }
    ]);
  </script>

</body>
</html>
