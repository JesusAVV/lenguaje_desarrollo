<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda de Ropa para Personas Mayores</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --navbar-bg: #333;
      --navbar-text: #f2f2f2;
      --navbar-hover: #575757;
      --header-bg: #6b8e23;
      --btn-bg: #6b8e23;
    }
  </style>
</head>
<body>

  <!-- Barra de menú -->
  <div id="navbar-container"></div>

  <!-- Banner -->
  <header>
    <h1>Ropa Cómoda y Elegante para Personas Mayores</h1>
    <p>Diseño, comodidad y estilo a cualquier edad</p>
  </header>

  <!-- Productos -->
  <main class="productos" id="productos-container"></main>

  <script src="components.js"></script>
  <script>
    renderNavbar("navbar-container");

    renderProductCards("productos-container", [
      {
        image: "Imagenes/camiseta_de_lana.jpg",
        alt: "Suéter de lana",
        name: "Suéter de lana - Hombre",
        price: "29.90/s",
        description: "Cálido y suave, ideal para el invierno."
      },
      {
        image: "Imagenes/pantalon_elastico.webp",
        alt: "Pantalón cómodo",
        name: "Pantalón cómodo - Hombre",
        price: "35.90/s",
        description: "Elástico, fácil de poner y quitar."
      },
      {
        image: "Imagenes/bata_comoda.jpg",
        alt: "Bata ligera",
        name: "Bata ligera - Hombre",
        price: "15.90/s",
        description: "Perfecta para estar en casa con estilo."
      },
      {
        image: "Imagenes/Bata_de_mujer.jpg",
        alt: "Bata ligera",
        name: "Bata ligera - Mujer",
        price: "29.90/s",
        description: "Prenda comoda para usar al levantarte."
      },
      {
        image: "Imagenes/Pantalon_ligero_mujer.jpg",
        alt: "Pantalon Ligero",
        name: "Pantalon Ligero - Mujer",
        price: "15.90/s",
        description: "Perfecto para el uso cotidiano."
      },
      {
        image: "Imagenes/Sueter_Lana_mujer.jpg",
        alt: "Polera ligera",
        name: "Polera ligera - Mujer",
        price: "25.90/s",
        description: "Usual para los climas frios."
      }
    ]);
  </script>

</body>
</html>
